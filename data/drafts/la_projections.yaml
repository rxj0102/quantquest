- id: linalg-013
  topic: linear_algebra
  node_id: la.projections
  difficulty: 1
  format: mental_math
  prompt_md: |
    The vector $v=(6,k)^T$ is projected orthogonally onto the line spanned by $u=(2,-1)^T$, and the
    projection turns out to be the zero vector. What is $k$? Give your answer as an integer.
  answer: "12"
  answer_type: numeric
  solution_md: |
    The projection onto the line is $\dfrac{v\cdot u}{u\cdot u}\,u$, which is zero exactly when
    $v\cdot u=0$. So $6\cdot2+k\cdot(-1)=0$, giving $k=12$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: solve(6*2 + k*(-1), k)[0]

- id: linalg-014
  topic: linear_algebra
  node_id: la.projections
  difficulty: 2
  format: derivation
  prompt_md: |
    The vector $v=(a,b)^T$ is projected orthogonally onto the line spanned by $u=(3,4)^T$. What is
    the squared length of the projection? Give your answer as a single expression in $a$ and $b$.
  answer: "(3*a + 4*b)**2/25"
  answer_type: symbolic
  solution_md: |
    The projection is $\dfrac{v\cdot u}{u\cdot u}\,u=\dfrac{3a+4b}{25}\,u$, and $|u|^2=25$, so its
    squared length is
    $$
    \frac{(3a+4b)^2}{25^2}\cdot 25=\frac{(3a+4b)^2}{25}.
    $$
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        det(Matrix([[a, b]])*Matrix([[3], [4]])*(Matrix([[3, 4]])*Matrix([[3], [4]]))**(-1)
        *Matrix([[3, 4]])*Matrix([[a], [b]]))

- id: linalg-015
  topic: linear_algebra
  node_id: la.projections
  difficulty: 3
  format: derivation
  prompt_md: |
    In $\mathbb{R}^3$, let $\Pi$ be the plane spanned by $a_1=(1,1,0)^T$ and $a_2=(1,-1,1)^T$. What
    is the first coordinate of the orthogonal projection of $b=(2,4,3)^T$ onto $\Pi$? Give your
    answer as a fraction in lowest terms.
  answer: "10/3"
  answer_type: numeric
  solution_md: |
    Since $a_1\cdot a_2=0$, the projection is the sum of the projections onto each vector:
    $$
    \frac{b\cdot a_1}{a_1\cdot a_1}a_1+\frac{b\cdot a_2}{a_2\cdot a_2}a_2
    =\frac{6}{2}(1,1,0)+\frac13(1,-1,1)=\left(\tfrac{10}{3},\tfrac83,\tfrac13\right).
    $$
    The first coordinate is $10/3$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        det(Matrix([[1, 0, 0]])*Matrix([[1, 1], [1, -1], [0, 1]])
        *(Matrix([[1, 1, 0], [1, -1, 1]])*Matrix([[1, 1], [1, -1], [0, 1]]))**(-1)
        *Matrix([[1, 1, 0], [1, -1, 1]])*Matrix([[2], [4], [3]]))

- id: linalg-016
  topic: linear_algebra
  node_id: la.projections
  difficulty: 2
  format: mental_math
  prompt_md: |
    What is the distance from the point $(4,2,-1)$ to the plane $2x+y-2z=0$? Give your answer as an
    integer.
  answer: "4"
  answer_type: numeric
  solution_md: |
    The plane has normal $n=(2,1,-2)$ with $|n|=3$. The distance is the length of the projection of
    the point onto $n$: $|2\cdot4+2-2\cdot(-1)|/3=12/3=4$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Abs(solve(2*(4 - 2*t) + (2 - t) - 2*(-1 + 2*t), t)[0])*sqrt(2**2 + 1**2 + 2**2)

- id: linalg-017
  topic: linear_algebra
  node_id: la.projections
  difficulty: 3
  format: derivation
  prompt_md: |
    A least-squares line $y=a+bx$, with an intercept $a$, is fitted to the four points
    $(0,1),(1,3),(2,4),(3,8)$. What is the intercept $a$? Give your answer as a fraction in lowest
    terms.
  answer: "7/10"
  answer_type: numeric
  solution_md: |
    With $n=4$, $\sum x=6$, $\sum y=16$, $\sum xy=35$ and $\sum x^2=14$, the slope is
    $b=\dfrac{4\cdot35-6\cdot16}{4\cdot14-6^2}=\dfrac{44}{20}=\dfrac{11}{5}$. The line passes
    through $(\bar x,\bar y)=(1.5,4)$, so $a=4-\tfrac{11}{5}\cdot1.5=\tfrac{7}{10}$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        det(Matrix([[1, 0]])*(Matrix([[1, 1, 1, 1], [0, 1, 2, 3]])
        *Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]))**(-1)*Matrix([[1, 1, 1, 1], [0, 1, 2, 3]])
        *Matrix([[1], [3], [4], [8]]))

- id: linalg-018
  topic: linear_algebra
  node_id: la.projections
  difficulty: 2
  format: derivation
  prompt_md: |
    Let $P$ be the matrix of the orthogonal projection onto the column space of
    $A=\begin{pmatrix}1&0\\1&1\\1&2\\1&3\end{pmatrix}$, whose two columns are linearly independent.
    What is the trace of $P$? Give your answer as an integer.
  answer: "2"
  answer_type: numeric
  solution_md: |
    A projection matrix has eigenvalue $1$ on the subspace it projects onto and $0$ elsewhere, so its
    trace is the dimension of that subspace. The two columns of $A$ are independent, so the column
    space has dimension $2$ and $\operatorname{tr}P=2$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        trace(Matrix([[1, 0], [1, 1], [1, 2], [1, 3]])*(Matrix([[1, 1, 1, 1], [0, 1, 2, 3]])
        *Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]))**(-1)*Matrix([[1, 1, 1, 1], [0, 1, 2, 3]]))

- id: linalg-019
  topic: linear_algebra
  node_id: la.projections
  difficulty: 4
  format: derivation
  prompt_md: |
    Reflect $b=(3,0,1)^T$ across the plane spanned by $(1,0,1)^T$ and $(0,1,1)^T$. This plane
    passes through the origin. The reflection is $2p-b$, where $p$ is the orthogonal projection of
    $b$ onto the plane. What is the third coordinate of the reflected vector? Give your answer as a
    fraction in lowest terms.
  answer: "7/3"
  answer_type: numeric
  solution_md: |
    The plane has normal $n=(1,1,-1)^T$, since $n$ is perpendicular to both spanning vectors. The
    component of $b$ along $n$ is $\dfrac{b\cdot n}{n\cdot n}n=\dfrac23 n$, and reflecting removes it
    twice:
    $$
    2p-b=b-2\cdot\tfrac23 n=\left(\tfrac53,-\tfrac43,\tfrac73\right).
    $$
    The third coordinate is $7/3$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        det(Matrix([[0, 0, 1]])*(2*Matrix([[1, 0], [0, 1], [1, 1]])
        *(Matrix([[1, 0, 1], [0, 1, 1]])*Matrix([[1, 0], [0, 1], [1, 1]]))**(-1)
        *Matrix([[1, 0, 1], [0, 1, 1]]) - Matrix([[1, 0, 0], [0, 1, 0], [0, 0, 1]]))
        *Matrix([[3], [0], [1]]))
