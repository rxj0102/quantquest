# Curated probability questions. All wording is original.
# status stays "fresh" until M2 verifiers exist (CLAUDE.md rule 3).
# Each entry may carry a `reference:` block: the independent evidence used to verify it
# (exact expression, named simulator, pricing inputs or code tests). Adding a question is a
# single-file edit. Changing a reference sends the question back to `fresh` until re-verified.
- id: prob-001
  topic: probability
  node_id: prob.counting
  difficulty: 1
  format: probability
  prompt_md: |
    Two fair six-sided dice are rolled once. What is the probability that the two faces sum to $9$?
  answer: "1/9"
  answer_type: numeric
  solution_md: |
    Of the $36$ equally likely ordered outcomes, the ones summing to $9$ are $(3,6),(4,5),(5,4),(6,3)$.
    That is $4/36 = 1/9$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(Sum(KroneckerDelta(a + b, 9), (a, 1, 6)), (b, 1, 6))/36
      symbols:
        a: integer
        b: integer
    simulator:
      name: dice_sum_equals
      params:
        n_dice: 2
        sides: 6
        target: 9

- id: prob-002
  topic: probability
  node_id: prob.conditional
  difficulty: 1
  format: probability
  prompt_md: |
    A drawer holds $5$ red socks and $3$ blue socks. You pull out two socks at random without
    replacement. What is the probability that both are red?
  answer: "5/14"
  answer_type: numeric
  solution_md: |
    $P = \frac{5}{8}\cdot\frac{4}{7} = \frac{20}{56} = \frac{5}{14}$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: binomial(5, 2)/binomial(8, 2)
    simulator:
      name: draw_all_of_color
      params:
        counts:
          red: 5
          blue: 3
        k: 2
        color: red

- id: prob-003
  topic: probability
  node_id: prob.expectation
  difficulty: 1
  format: mental_math
  prompt_md: |
    You roll a fair die repeatedly until a six first appears. What is the expected number of rolls,
    counting the roll that shows the six?
  answer: "6"
  answer_type: numeric
  solution_md: |
    The number of rolls is geometric with success probability $p = 1/6$, so the mean is $1/p = 6$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(Rational(5, 6)**(k - 1), (k, 1, oo))
      symbols:
        k: integer

- id: prob-004
  topic: probability
  node_id: prob.counting
  difficulty: 2
  format: probability
  prompt_md: |
    A fair coin is flipped $4$ times. What is the probability of seeing at least $2$ heads?
  answer: "11/16"
  answer_type: numeric
  solution_md: |
    Use the complement. $P(0\text{ heads}) = 1/16$ and $P(1\text{ head}) = 4/16$, so
    $P(\ge 2) = 1 - 5/16 = 11/16$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(binomial(4, j), (j, 2, 4))/2**4
      symbols:
        j: integer
    simulator:
      name: coin_heads_at_least
      params:
        n: 4
        k: 2

- id: prob-005
  topic: probability
  node_id: prob.counting
  difficulty: 3
  format: probability
  prompt_md: |
    Four letters are placed at random into four addressed envelopes, one letter per envelope.
    What is the probability that no letter lands in its own envelope?
  answer: "3/8"
  answer_type: numeric
  solution_md: |
    Count derangements of $4$ items by inclusion-exclusion:
    $4!\,(1 - 1 + \tfrac12 - \tfrac16 + \tfrac1{24}) = 9$. The probability is $9/24 = 3/8$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: subfactorial(4)/factorial(4)
    simulator:
      name: derangement
      params:
        n: 4

- id: prob-006
  topic: probability
  node_id: prob.conditional
  difficulty: 3
  format: probability
  prompt_md: |
    A screening test for a condition with $1\%$ prevalence flags $95\%$ of people who have it
    and falsely flags $10\%$ of people who do not. Given that a randomly chosen person is flagged,
    what is the probability they actually have the condition?
  answer: "19/217"
  answer_type: numeric
  solution_md: |
    By Bayes' rule,
    $P = \frac{0.95\cdot 0.01}{0.95\cdot 0.01 + 0.10\cdot 0.99} = \frac{0.0095}{0.1085} = \frac{19}{217}\approx 0.0876$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: (100*Rational(95, 100))/(100*Rational(95, 100) + 9900*Rational(10, 100))
    simulator:
      name: screening_posterior
      params:
        prevalence: 0.01
        sensitivity: 0.95
        false_positive: 0.1

- id: prob-007
  topic: probability
  node_id: prob.expectation
  difficulty: 3
  format: derivation
  prompt_md: |
    Let $U$ and $V$ be independent and uniformly distributed on $[0,1]$. Find $\mathbb{E}[\max(U,V)]$.
  answer: "2/3"
  answer_type: numeric
  solution_md: |
    $P(\max \le t) = t^2$, so the density is $2t$ and
    $\mathbb{E}[\max] = \int_0^1 t\cdot 2t\,dt = 2/3$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Integral(Integral(u, (v, 0, u)), (u, 0, 1)) + Integral(Integral(v, (u, 0, v)), (v, 0, 1))
      symbols:
        u: positive
        v: positive
    simulator:
      name: max_of_uniforms
      params:
        k: 2

- id: prob-008
  topic: probability
  node_id: prob.expectation
  difficulty: 4
  format: probability
  prompt_md: |
    A fair random walk moves $\pm 1$ each step with equal probability. It starts at $3$ and stops
    the first time it reaches $0$ or $10$. What is the probability that it stops at $10$?
  answer: "3/10"
  answer_type: numeric
  solution_md: |
    The walk is a martingale and the stopping time is bounded in expectation, so
    $3 = 10\cdot p + 0\cdot(1-p)$, giving $p = 3/10$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: gamblers_ruin(3, 0, 10)
    simulator:
      name: walk_hits_upper
      params:
        start: 3
        lower: 0
        upper: 10

- id: prob-009
  topic: probability
  node_id: prob.conditional
  difficulty: 1
  format: mental_math
  prompt_md: |
    A fair $10$-sided die with faces numbered $1$ to $10$ is rolled once. You are told only that
    the result is a multiple of $3$. What is the probability that the result is greater than $5$?
    Give your answer as a fraction in lowest terms.
  answer: "2/3"
  answer_type: numeric
  solution_md: |
    Given that the result is a multiple of $3$, the possibilities are $3, 6, 9$, all equally likely.
    Two of them, $6$ and $9$, exceed $5$, so the probability is $2/3$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: (floor(10/3) - floor(5/3))/floor(10/3)
    simulator:
      name: dice_event
      params:
        dice: [10]
        given:
          - {stat: first, mod: 3, cmp: eq, value: 0}
        event:
          - {stat: first, cmp: gt, value: 5}

- id: prob-010
  topic: probability
  node_id: prob.conditional
  difficulty: 2
  format: probability
  prompt_md: |
    A red die and a blue die, each fair with six faces, are thrown together. A friend tells you
    the two dice landed on different numbers. With that information, what is the probability
    that the two numbers total $8$? Give your answer as a fraction in lowest terms.
  answer: "2/15"
  answer_type: numeric
  solution_md: |
    There are $6\cdot 5 = 30$ equally likely ordered outcomes with different numbers. Those
    totalling $8$ are $(2,6), (6,2), (3,5), (5,3)$; the outcome $(4,4)$ is ruled out by the
    condition. So the probability is $4/30 = 2/15$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        Sum(Sum(KroneckerDelta(a + b, 8)*(1 - KroneckerDelta(a, b)), (a, 1, 6)), (b, 1, 6))
        / Sum(Sum(1 - KroneckerDelta(a, b), (a, 1, 6)), (b, 1, 6))
      symbols: {a: integer, b: integer}
    simulator:
      name: dice_event
      params:
        dice: [6, 6]
        given:
          - {stat: num_distinct, cmp: eq, value: 2}
        event:
          - {stat: sum, cmp: eq, value: 8}

- id: prob-011
  topic: probability
  node_id: prob.conditional
  difficulty: 2
  format: derivation
  prompt_md: |
    A technician keeps two boxes of resistors. Box A holds $3$ faulty and $9$ good resistors; box B
    holds $7$ faulty and $13$ good ones. She rolls a fair six-sided die: on a $1$ or a $2$ she opens
    box A, otherwise box B. She then draws one resistor at random from the box she opened. What is
    the probability that the resistor is faulty? Give your answer as a fraction in lowest terms.
  answer: "19/60"
  answer_type: numeric
  solution_md: |
    By the law of total probability, with $P(A)=\tfrac13$ and $P(B)=\tfrac23$:
    $$
    \begin{aligned}
    P(\text{faulty}) &= \tfrac13\cdot\tfrac{3}{12} + \tfrac23\cdot\tfrac{7}{20} \\
    &= \tfrac1{12} + \tfrac{7}{30} = \tfrac{5}{60} + \tfrac{14}{60} = \tfrac{19}{60}.
    \end{aligned}
    $$
  source: curated
  status: fresh
  reference:
    exact:
      expr: Rational(1, 3)*Rational(3, 12) + Rational(2, 3)*Rational(7, 20)

- id: prob-014
  topic: probability
  node_id: prob.conditional
  difficulty: 4
  format: probability
  prompt_md: |
    Four fair six-sided dice are rolled. You are told that the largest number showing is exactly
    $5$. Given this, what is the probability that exactly two of the dice show a $5$? Give your
    answer as a fraction in lowest terms.
  answer: "32/123"
  answer_type: numeric
  solution_md: |
    Outcomes with maximum exactly $5$: every die is at most $5$, and not every die is at most $4$,
    so there are $5^4-4^4 = 369$. Of these, exactly two $5$s with the other two dice in
    $\{1,2,3,4\}$ gives $\binom42\cdot 4^2 = 96$. The probability is $96/369 = 32/123$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: (binomial(4, 2)*4**2)/(5**4 - 4**4)
    simulator:
      name: dice_event
      params:
        dice: [6, 6, 6, 6]
        given:
          - {stat: max, cmp: eq, value: 5}
        event:
          - {stat: count_eq, face: 5, cmp: eq, value: 2}

- id: prob-015
  topic: probability
  node_id: prob.conditional
  difficulty: 3
  format: derivation
  prompt_md: |
    Three tickets are drawn one after another, without replacement, from a box holding tickets
    numbered $1$ through $8$. You learn that the largest of the three numbers drawn is $7$. Given
    this, what is the expected value of the smallest number drawn? Give your answer as a fraction
    in lowest terms.
  answer: "7/3"
  answer_type: numeric
  solution_md: |
    The largest being $7$ means the other two tickets are a uniformly random pair from
    $\{1,\dots,6\}$, so there are $\binom62 = 15$ equally likely pairs. The smallest ticket is
    $m$ exactly when the other member of the pair is one of the $6-m$ values above $m$, so
    $$
    \begin{aligned}
    E[\text{smallest}\mid \max=7] &= \frac{1}{15}\sum_{m=1}^{5} m\,(6-m) \\
    &= \frac{5+8+9+8+5}{15} = \frac{35}{15} = \frac73.
    \end{aligned}
    $$
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(m*(6 - m), (m, 1, 5)) / binomial(6, 2)
      symbols: {m: integer}

- id: prob-012
  topic: probability
  node_id: prob.conditional
  difficulty: 3
  format: probability
  prompt_md: |
    A rare defect affects $2\%$ of the circuit boards from a factory. An inspection machine flags
    $90\%$ of defective boards and also flags $5\%$ of sound boards. Every board is inspected twice.
    The two inspections are independent of each other for any one board: once you know whether it
    is defective or sound, the first result tells you nothing about the second. A randomly chosen
    board is flagged on both inspections. What is the probability that it is actually defective? Give your
    answer as a fraction in lowest terms.
  answer: "324/373"
  answer_type: numeric
  solution_md: |
    Two independent flags multiply: a defective board is flagged twice with probability
    $0.9^2 = 0.81$, a sound board with probability $0.05^2 = 0.0025$. By Bayes' rule
    $$
    \begin{aligned}
    P(\text{defective}\mid\text{flagged twice})
    &= \frac{0.02\cdot 0.81}{0.02\cdot 0.81 + 0.98\cdot 0.0025} \\
    &= \frac{0.0162}{0.01865} = \frac{324}{373}\approx 0.869.
    \end{aligned}
    $$
  source: curated
  status: fresh
  reference:
    exact:
      expr: >-
        (400*Rational(9, 10)**2) / (400*Rational(9, 10)**2 + 19600*Rational(1, 20)**2)
    simulator:
      name: screening_posterior
      params: {prevalence: 0.02, sensitivity: 0.81, false_positive: 0.0025}
