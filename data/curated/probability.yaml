# Curated probability questions. All wording is original.
# status stays "fresh" until M2 verifiers exist (CLAUDE.md rule 3).
# Each entry may carry a `reference:` block: the independent evidence used to verify it
# (exact expression, named simulator, pricing inputs or code tests). Adding a question is a
# single-file edit. Changing a reference sends the question back to `fresh` until re-verified.
- id: prob-001
  topic: probability
  node_id: prob.counting
  difficulty: 1
  format: probability
  prompt_md: |
    Two fair six-sided dice are rolled once. What is the probability that the two faces sum to $9$?
  answer: "1/9"
  answer_type: numeric
  solution_md: |
    Of the $36$ equally likely ordered outcomes, the ones summing to $9$ are $(3,6),(4,5),(5,4),(6,3)$.
    That is $4/36 = 1/9$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(Sum(KroneckerDelta(a + b, 9), (a, 1, 6)), (b, 1, 6))/36
      symbols:
        a: integer
        b: integer
    simulator:
      name: dice_sum_equals
      params:
        n_dice: 2
        sides: 6
        target: 9

- id: prob-002
  topic: probability
  node_id: prob.conditional
  difficulty: 1
  format: probability
  prompt_md: |
    A drawer holds $5$ red socks and $3$ blue socks. You pull out two socks at random without
    replacement. What is the probability that both are red?
  answer: "5/14"
  answer_type: numeric
  solution_md: |
    $P = \frac{5}{8}\cdot\frac{4}{7} = \frac{20}{56} = \frac{5}{14}$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: binomial(5, 2)/binomial(8, 2)
    simulator:
      name: draw_all_of_color
      params:
        counts:
          red: 5
          blue: 3
        k: 2
        color: red

- id: prob-003
  topic: probability
  node_id: prob.expectation
  difficulty: 1
  format: mental_math
  prompt_md: |
    You roll a fair die repeatedly until a six first appears. What is the expected number of rolls,
    counting the roll that shows the six?
  answer: "6"
  answer_type: numeric
  solution_md: |
    The number of rolls is geometric with success probability $p = 1/6$, so the mean is $1/p = 6$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(Rational(5, 6)**(k - 1), (k, 1, oo))
      symbols:
        k: integer

- id: prob-004
  topic: probability
  node_id: prob.counting
  difficulty: 2
  format: probability
  prompt_md: |
    A fair coin is flipped $4$ times. What is the probability of seeing at least $2$ heads?
  answer: "11/16"
  answer_type: numeric
  solution_md: |
    Use the complement. $P(0\text{ heads}) = 1/16$ and $P(1\text{ head}) = 4/16$, so
    $P(\ge 2) = 1 - 5/16 = 11/16$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Sum(binomial(4, j), (j, 2, 4))/2**4
      symbols:
        j: integer
    simulator:
      name: coin_heads_at_least
      params:
        n: 4
        k: 2

- id: prob-005
  topic: probability
  node_id: prob.counting
  difficulty: 3
  format: probability
  prompt_md: |
    Four letters are placed at random into four addressed envelopes, one letter per envelope.
    What is the probability that no letter lands in its own envelope?
  answer: "3/8"
  answer_type: numeric
  solution_md: |
    Count derangements of $4$ items by inclusion-exclusion:
    $4!\,(1 - 1 + \tfrac12 - \tfrac16 + \tfrac1{24}) = 9$. The probability is $9/24 = 3/8$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: subfactorial(4)/factorial(4)
    simulator:
      name: derangement
      params:
        n: 4

- id: prob-006
  topic: probability
  node_id: prob.conditional
  difficulty: 3
  format: probability
  prompt_md: |
    A screening test for a condition with $1\%$ prevalence flags $95\%$ of people who have it
    and falsely flags $10\%$ of people who do not. Given that a randomly chosen person is flagged,
    what is the probability they actually have the condition?
  answer: "19/217"
  answer_type: numeric
  solution_md: |
    By Bayes' rule,
    $P = \frac{0.95\cdot 0.01}{0.95\cdot 0.01 + 0.10\cdot 0.99} = \frac{0.0095}{0.1085} = \frac{19}{217}\approx 0.0876$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: (100*Rational(95, 100))/(100*Rational(95, 100) + 9900*Rational(10, 100))
    simulator:
      name: screening_posterior
      params:
        prevalence: 0.01
        sensitivity: 0.95
        false_positive: 0.1

- id: prob-007
  topic: probability
  node_id: prob.expectation
  difficulty: 3
  format: derivation
  prompt_md: |
    Let $U$ and $V$ be independent and uniformly distributed on $[0,1]$. Find $\mathbb{E}[\max(U,V)]$.
  answer: "2/3"
  answer_type: numeric
  solution_md: |
    $P(\max \le t) = t^2$, so the density is $2t$ and
    $\mathbb{E}[\max] = \int_0^1 t\cdot 2t\,dt = 2/3$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: Integral(Integral(u, (v, 0, u)), (u, 0, 1)) + Integral(Integral(v, (u, 0, v)), (v, 0, 1))
      symbols:
        u: positive
        v: positive
    simulator:
      name: max_of_uniforms
      params:
        k: 2

- id: prob-008
  topic: probability
  node_id: prob.expectation
  difficulty: 4
  format: probability
  prompt_md: |
    A fair random walk moves $\pm 1$ each step with equal probability. It starts at $3$ and stops
    the first time it reaches $0$ or $10$. What is the probability that it stops at $10$?
  answer: "3/10"
  answer_type: numeric
  solution_md: |
    The walk is a martingale and the stopping time is bounded in expectation, so
    $3 = 10\cdot p + 0\cdot(1-p)$, giving $p = 3/10$.
  source: curated
  status: fresh
  reference:
    exact:
      expr: gamblers_ruin(3, 0, 10)
    simulator:
      name: walk_hits_upper
      params:
        start: 3
        lower: 0
        upper: 10
